name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backendPortfolio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14t"
          cache: pip
          cache-dependency-path: backendPortfolio/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Require the free-threaded interpreter
        run: python -c "import sys, sysconfig; assert sysconfig.get_config_var('Py_GIL_DISABLED') == 1; assert not sys._is_gil_enabled()"

      - name: Test with 100% coverage
        run: python -m pytest --cov=main --cov-branch --cov-report=term-missing --cov-fail-under=100

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontendPortfolio
    env:
      PUBLIC_BACKEND_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontendPortfolio/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check and lint
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Start the fixture API
        run: |
          node tests/support/mockBackend.mjs &
          for attempt in $(seq 1 30); do
            curl --silent --fail http://localhost:8080/health > /dev/null && exit 0
            sleep 1
          done
          echo "fixture API did not start" >&2
          exit 1

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontendPortfolio/playwright-report
          retention-days: 7
