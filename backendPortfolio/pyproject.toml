[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-portfolio"
version = "0.1.0"
description = "Backend for the portfolio site, built for free-threaded Python 3.14t."
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.3.0",
    "certifi>=2026.7.22",
    "envyaml>=1.10.211231",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "jinja2>=3.1.6",
    "json-repair>=0.63.5",
    "fastapi>=0.142.2",
    "gunicorn>=26.2.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "limits>=5.8.0",
    "pytimeparse2>=1.7.1",
    "PyYAML>=6.0.3",
    "uvicorn[standard]>=0.54.0",
    "uvicorn-worker>=0.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.setuptools.packages.find]
include = ["main*"]
namespaces = true

[tool.setuptools.package-data]
"main.config" = ["config.yaml"]
"main.package.static" = ["*.json"]
"main.package.repository" = ["*.sql"]
"main.package.service.context" = ["templates/*.md"]
"main.package.service.contact" = ["templates/*.md"]
"main.package.ai.orchestrator" = ["*.md"]
"main.package.ai.worker" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live' --strict-markers"
markers = [
    "live: calls the real LeetCode, Codeforces and GitHub APIs; run with -m live",
]
