app:
  host: "0.0.0.0"
  port: 8080
  workers: 1
  thread_pool_size: 64
  timeout: "180s"
  graceful_timeout: "30s"
  keepalive: "5s"
  max_body_bytes: 262144
  trust_forwarded_for: true
  cors:
    allow_origins: ["*"]
    max_age: "1h"

ttl_key_value_store:
  sweep_intervals:
    in_memory: "20m"

http_client:
  connect_timeout: "10s"
  read_timeout: "60s"
  write_timeout: "60s"
  pool_timeout: "10s"

leetcode:
  base_url: "https://leetcode.com"

codeforces:
  base_url: "https://codeforces.com"

github:
  base_url: "https://api.github.com"
  api_version: "2022-11-28"
  per_page: 100

groq:
  base_url: "https://api.groq.com"
  api_keys: "${GROQ_API_KEYS}"

llm:
  models:
    - model_id: "openai/gpt-oss-20b"
      weight: 60
      reasoning_effort: "medium"
      supports_strict_json_schema: true
    - model_id: "openai/gpt-oss-120b"
      weight: 40
      reasoning_effort: "medium"
      supports_strict_json_schema: true
  temperature_range: [0.8, 1.4]
  top_p_range: [0.9, 1.0]
  max_completion_tokens: 2048

orchestrator:
  temperature: 0.0
  top_p: 1.0

repository:
  database_path: "data/backend_portfolio.sqlite3"
  session_ttl: "12h"
  sweep_interval: "20m"
  busy_timeout: "5s"

data_service:
  cache_impl: in_memory
  max_workers: 8
  leetcode_accounts:
    - username: "imsahibnanda"
      cache_ttl: "1h"
  codeforces_accounts:
    - username: "shisukenohara"
      cache_ttl: "80m"
  github_accounts:
    - username: "thesahibnanda-max"
      cache_ttl: "45m"
    - username: "thesahibnanda"
      cache_ttl: "120m"
  profile_photo_links:
    - "https://zaiwjonzbotyjmoghqzh.supabase.co/storage/v1/object/public/portfolio/ProPic1.png"
    - "https://zaiwjonzbotyjmoghqzh.supabase.co/storage/v1/object/public/portfolio/ProPic2.png"
  leetcode_profile_url_format: "{base_url}/u/{username}/"
  codeforces_profile_url_format: "{base_url}/profile/{username}"

chat:
  max_message_chars: 4000
  max_history_messages: 20
  max_history_chars: 12000
  max_messages_per_chat: 200
  fallback_messages:
    NOT_RELATED_TO_PORTFOLIO: "I can only help with questions about Sahib Nanda's portfolio: his experience, projects, skills, coding profiles and interests. Please ask something about those."
    PROMPT_INJECTION: "I can't change how I work, but I'm happy to answer questions about Sahib Nanda's portfolio."
    UNSAFE: "I can't help with that. Please ask a question about Sahib Nanda's portfolio."

agent:
  model:
    model_id: "openai/gpt-oss-20b"
    weight: 1
    reasoning_effort: "low"
  temperature: 0.6
  top_p: 1.0
  max_completion_tokens: 600
  max_question_chars: 500
  max_history_messages: 6
  max_history_chars: 2500
  max_messages_per_chat: 200
  cache_ttl: "6h"
  daily_token_budget: 400000
  markers:
    NOT_RELATED_TO_PORTFOLIO: "⟂OOS"
    PROMPT_INJECTION: "⟂INJ"
    UNSAFE: "⟂UNS"
  injection_patterns:
    - "ignore (all |any |the )?(previous|prior|above) (instructions|prompts?|rules)"
    - "disregard (all |any |the )?(previous|prior|above|your) (instructions|prompts?|rules)"
    - "(reveal|show|print|repeat) (me )?(your|the) (system )?(prompt|instructions)"
    - "\\byou are now\\b"
    - "\\b(developer|dan|jailbreak) mode\\b"
  off_topic_patterns:
    - "\\b(write|generate|create|make|give) (me )?(a|an|some) (python|java|javascript|sql|bash|code|script|program|function|essay|poem|story|song|joke|letter|email|cover letter)\\b"
    - "\\b(debug|fix|refactor|explain) (this|my) (code|bug|error|program)\\b"
    - "\\bcapital of\\b"
    - "\\btranslate\\b"
    - "\\bsolve (this|my|the following)\\b"
    - "\\bhomework\\b"
    - "\\bweather\\b"
    - "\\brecipe\\b"
  default_contexts: [PROFILE]
  context_keywords:
    PROFILE:
      - "experience"
      - "work"
      - "job"
      - "role"
      - "compan"
      - "intern"
      - "project"
      - "built"
      - "build"
      - "skill"
      - "stack"
      - "tech"
      - "language"
      - "educat"
      - "degree"
      - "college"
      - "universit"
      - "achiev"
      - "award"
      - "resume"
      - "résumé"
      - "contact"
      - "email"
      - "hire"
      - "linkedin"
    GITHUB:
      - "github"
      - "repo"
      - "open source"
      - "open-source"
      - "star"
      - "commit"
    LEETCODE:
      - "leetcode"
      - "dsa"
      - "problems solved"
      - "streak"
      - "rating"
      - "contest"
      - "competitive"
    CODEFORCES:
      - "codeforces"
      - "rating"
      - "contest"
      - "competitive"
      - "cp"
    PERSONALITY:
      - "hobb"
      - "interest"
      - "favo"
      - "movie"
      - "game"
      - "music"
      - "sport"
      - "football"
      - "cricket"
      - "gym"
      - "fitness"
      - "personality"
      - "trait"
      - "value"
      - "fun"
      - "free time"

context:
  max_workers: 5
  max_github_repositories: 5
  max_rating_changes: 5

rate_limit:
  storage_uri: "memory://"
  key_prefix: "rate_limit"
  rules:
    create_session:
      ip: {limit: 10, window: "1m"}
      session: {limit: 10, window: "1m"}
      global: {limit: 300, window: "1m"}
    chat_read:
      ip: {limit: 30, window: "1m"}
      session: {limit: 30, window: "1m"}
      global: {limit: 900, window: "1m"}
    chat_write:
      ip: {limit: 30, window: "1m"}
      session: {limit: 30, window: "1m"}
      global: {limit: 900, window: "1m"}
    chat_message:
      ip: {limit: 5, window: "1m"}
      session: {limit: 5, window: "1m"}
      global: {limit: 60, window: "1m"}
    agent_message:
      ip: {limit: 6, window: "1m"}
      session: {limit: 6, window: "1m"}
      global: {limit: 60, window: "1m"}
    details:
      ip: {limit: 30, window: "1m"}
      session: {limit: 30, window: "1m"}
      global: {limit: 900, window: "1m"}
    contact:
      ip: {limit: 3, window: "1h"}
      session: {limit: 3, window: "1h"}
      global: {limit: 50, window: "24h"}

mail:
  recipient_mail: "${RECIPIENT_MAIL}"
  sender_name: "Sahib Nanda · Portfolio"
  timeout: "15s"
  accounts:
    - host: "smtp.gmail.com"
      port: 587
      security: starttls
      username: "${MAIL_ACCOUNT_1_USERNAME}"
      password: "${MAIL_ACCOUNT_1_PASSWORD}"
    - host: "smtp.gmail.com"
      port: 587
      security: starttls
      username: "${MAIL_ACCOUNT_2_USERNAME}"
      password: "${MAIL_ACCOUNT_2_PASSWORD}"

contact:
  subject_prefix: "[Portfolio]"
  max_subject_chars: 150
  max_message_chars: 5000
  check_email_deliverability: true
  email_dns_timeout: "3s"
